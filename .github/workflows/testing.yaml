name: CI
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: read

jobs:
  Quality:
    name: "ruff & mypy"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89  # v4.1.0
        with:
          version-file: uv.lock
      - run: ruff check
      - run: ruff format --check
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          enable-cache: true
      - uses: ./.github/actions/ensure-tycmd
        with:
          cache-key-os: ubuntu-latest
          manylinux-image: quay.io/pypa/manylinux_2_28_x86_64:2026.10.10-1@sha256:4131ddd7acb9c6c966af02fe7e71edc51e078c2d41f475966697676430bfa2ae
          build-in-container: 'true'
      - name: Sync dependencies
        run: uv sync --no-default-groups --group tox
      - run: uv run tox -m 'typing' --fail-fast -p --parallel-no-spinner

  Testing:
    name: Testing (${{ matrix.os }})
    needs: [Quality]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            manylinux-image: quay.io/pypa/manylinux_2_28_x86_64:2026.10.10-1@sha256:4131ddd7acb9c6c966af02fe7e71edc51e078c2d41f475966697676430bfa2ae
          - os: ubuntu-24.04-arm
            manylinux-image: quay.io/pypa/manylinux_2_28_aarch64:2026.10.10-1@sha256:abd1230aa9e4058a74b89d27cd14ba18c0db036d7bfe6e6f219a29ea63c24eb6
          - os: macos-26-intel
          - os: macos-latest
          - os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
      - uses: ./.github/actions/ensure-tycmd
        with:
          cache-key-os: ${{ matrix.os }}
          manylinux-image: ${{ matrix.manylinux-image }}
          build-in-container: ${{ matrix.manylinux-image != '' }}
      - name: Sync dependencies
        run: uv sync --no-default-groups --group tox --group ci
      - name: Build wheel
        run: uv build --wheel
      - name: Run tox
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOX_OS: ${{ matrix.os }}
        run: uv run tox --skip-env 'linting|formatting|typing' --installpkg dist/*.whl --fail-fast -p --parallel-no-spinner -- -ci

  Finish:
    needs: Testing
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329  # v2.3.8
        continue-on-error: true
        with:
          parallel-finished: true
