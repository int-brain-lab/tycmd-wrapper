name: CI
on:
  push:
    branches:
      - main
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

jobs:
  Quality:
    name: "ruff & mypy"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version-file: uv.lock
      - run: ruff check
      - run: ruff format --check
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Cache tycmd binary
        id: cache-tycmd
        uses: actions/cache@v4
        with:
          path: bin
          key: tycmd-ubuntu-latest-${{ hashFiles('tycmd.py') }}
      - name: Install libudev
        if: steps.cache-tycmd.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - name: Ensure tycmd binary (builds from source if not cached)
        run: python3 pdm_build.py
      - name: Sync dependencies
        run: uv sync --no-default-groups --group tox
      - run: uv run tox -m 'typing' --fail-fast -p --parallel-no-spinner

  Testing:
    needs: [Quality]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Cache tycmd binary
        id: cache-tycmd
        uses: actions/cache@v4
        with:
          path: bin
          key: tycmd-${{ matrix.os }}-${{ hashFiles('tycmd.py') }}
      - name: Install libudev (Linux)
        if: runner.os == 'Linux' && steps.cache-tycmd.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows' && steps.cache-tycmd.outputs.cache-hit != 'true'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Ensure tycmd binary (builds from source if not cached)
        run: python3 pdm_build.py
      - name: Sync dependencies
        run: uv sync --no-default-groups --group tox --group ci
      - name: Build wheel
        run: uv build --wheel
      - name: Run tox
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOX_OS: ${{ matrix.os }}
        run: uv run tox --skip-env 'linting|formatting|typing' --installpkg dist/*.whl --fail-fast -p --parallel-no-spinner -- -ci

  Finish:
    needs: Testing
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: coverallsapp/github-action@v2
        continue-on-error: true
        with:
          parallel-finished: true
