name: CI
on:
  push:
    branches:
      - main
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

jobs:
  Quality:
    name: "ruff & mypy"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version-file: uv.lock
      - run: ruff check
      - run: ruff format --check
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # uv sync (and uv run) always need tycmd-wrapper's own metadata, which our custom
      # pdm-backend hook builds tycmd to obtain — same cache key as Testing's ubuntu-latest
      # entry below, so whichever job runs first warms it for the other.
      - name: Cache tycmd binary
        id: cache-tycmd
        uses: actions/cache@v4
        with:
          path: bin
          key: tycmd-ubuntu-latest-${{ hashFiles('tycmd.py') }}
      - name: Install libudev
        if: steps.cache-tycmd.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - name: Ensure tycmd binary (builds from source if not cached)
        run: python3 pdm_build.py
      - name: Sync dependencies
        run: uv sync --no-default-groups --group tox
      - run: uv run tox -m 'typing' --fail-fast -p --parallel-no-spinner

  Testing:
    needs: [Quality]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Cache tycmd binary
        id: cache-tycmd
        uses: actions/cache@v4
        with:
          path: bin
          key: tycmd-${{ matrix.os }}-${{ hashFiles('tycmd.py') }}
      - name: Install libudev (Linux)
        if: runner.os == 'Linux' && steps.cache-tycmd.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows' && steps.cache-tycmd.outputs.cache-hit != 'true'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Ensure tycmd binary (builds from source if not cached)
        run: python3 pdm_build.py
      - name: Sync dependencies
        run: uv sync --no-default-groups --group tox --group ci
      - name: Build wheel
        run: uv build --wheel
      - name: Run tox
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --installpkg: build the wheel once above (with tycmd already baked in) and have
        # every tox env just `uv pip install` that same wheel, instead of each of the 4
        # Python-version envs independently re-invoking our pdm-backend hook (redundant at
        # best; a real race if they ever ran before bin/tycmd existed).
        run: uv run tox --skip-env 'linting|formatting|typing' --installpkg dist/*.whl --fail-fast -p --parallel-no-spinner -- -ci

  Finish:
    needs: Testing
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: coverallsapp/github-action@v2
        continue-on-error: true
        with:
          parallel-finished: true
