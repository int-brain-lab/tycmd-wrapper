name: Publish to PyPI
on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

# read-only by default - the publish and release jobs request what they need
permissions:
  contents: read

jobs:
  check:
    name: Check version tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check that a version tag matching the package's version is published
        # also guards manual runs, which could otherwise publish from any branch. Ref names
        # are passed via env, as expanding them in the script would allow code injection.
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" != tag ]; then
            echo "::error::Publishing needs a version tag, not a $REF_TYPE"
            exit 1
          fi
          VERSION=$(sed -n "s/^__version__ = '\(.*\)'$/\1/p" tycmd/__init__.py)
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG doesn't match the package's version $VERSION"
            exit 1
          fi
  build:
    name: Build (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            container: quay.io/pypa/manylinux_2_28_x86_64
          - os: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
          - os: windows-latest
          - os: macos-latest
          - os: macos-26-intel
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: ./.github/actions/ensure-tycmd
        with:
          cache-key-os: ${{ matrix.os }}
          manylinux-image: ${{ matrix.container }}
      - name: Build distribution packages
        run: |
          uv build --sdist
          uv build --wheel
      - name: Upload sdist
        uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: sdist
          path: dist/*.tar.gz
          archive: false
          retention-days: 1
      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.os }}
          path: dist/*.whl
          archive: false
          retention-days: 1
  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tycmd-wrapper
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist
      - name: Publish to PyPI
        run: uv publish --check-url https://pypi.org/simple  # skip files already uploaded
  release:
    name: Create GitHub Release
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: gh release create "$TAG" dist/* --repo "$REPOSITORY" --generate-notes
