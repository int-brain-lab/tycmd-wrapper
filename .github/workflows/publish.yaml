name: Publish to PyPI
on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  build:
    name: Build release packages
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            container: quay.io/pypa/manylinux_2_28_x86_64
          - os: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
          - os: windows-latest
          - os: macos-latest
          - os: macos-26-intel
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: ./.github/actions/ensure-tycmd
        with:
          cache-key-os: ${{ matrix.os }}
          manylinux-image: ${{ matrix.container }}
      - name: Build distribution packages
        run: |
          uv build --sdist
          uv build --wheel
      - name: Upload sdist
        uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: sdist
          path: dist/*.tar.gz
          archive: false
          retention-days: 1
      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.os }}
          path: dist/*.whl
          archive: false
          retention-days: 1
  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tycmd-wrapper
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist
      - name: Publish to PyPI
        run: uv publish --check-url https://pypi.org/simple
