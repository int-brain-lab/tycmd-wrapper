name: Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'tycmd.py'

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: '3.10'
      - name: Cache tycmd binary
        id: cache-tycmd
        uses: actions/cache@v4
        with:
          path: bin
          key: tycmd-ubuntu-latest-${{ hashFiles('tycmd.py', 'pdm_build.py') }}
      - name: Install libudev
        if: steps.cache-tycmd.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - name: Ensure tycmd binary (builds from source if not cached)
        run: python3 pdm_build.py
      - name: Install dependencies
        run: uv sync --no-default-groups --group doc
      - name: Sphinx build
        run: uv run sphinx-build docs/source docs/build
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          publish_branch: gh-pages
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/build/
          force_orphan: true
