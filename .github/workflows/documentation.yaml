name: Documentation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'tycmd/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/documentation.yaml'  # e.g. Dependabot updates
      - '.github/actions/**'

permissions:
  contents: read
  pages: write  # deploy to GitHub Pages
  id-token: write  # verify the deployment's origin

# don't let two deployments overlap, but let a running one finish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          enable-cache: true
          python-version: '3.14'
      - uses: ./.github/actions/ensure-tycmd
        with:
          cache-key-os: ubuntu-latest
      - run: uv run sphinx-build -b dirhtml docs/source docs/build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: docs/build/
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
